<VirtualHost *:80>
    ServerName www.victorteleanu.com
    # Forzamos el puerto 9448 en la redirección
    Redirect permanent / https://www.victorteleanu.com:9448/
</VirtualHost>

<VirtualHost *:443>
    ServerName www.victorteleanu.com
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/apache.crt
    SSLCertificateKeyFile /etc/apache2/ssl/apache.key
    
    <Directory /var/www/html>
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>